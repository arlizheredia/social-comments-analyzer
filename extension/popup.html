<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Social Comments Analyzer – Extractor</title>
<style>
  :root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1f;--mut:#444746;--pri:#0b57d0;--chip:#e8f0fe}
  @media (prefers-color-scheme:dark){:root{--bg:#1f1f1f;--fg:#e3e3e3;--mut:#c4c7c5;--pri:#a8c7fa;--chip:#004a77}}
  body{margin:0;width:300px;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,Roboto,sans-serif}
  .wrap{padding:16px}
  .t{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;margin-bottom:8px}
  .t img{width:28px;height:28px}
  p{margin:6px 0;color:var(--mut);font-size:13px}
  .chip{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600}
  a.btn{display:block;text-align:center;margin-top:12px;background:var(--pri);color:var(--bg);text-decoration:none;border-radius:18px;padding:8px 14px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="t"><img src="icons/icon48.png" alt="">Social Comments Analyzer</div>
  <p><span class="chip" id="v">Extractor</span></p>
  <p>Esta extensión abre las publicaciones de tus seguimientos y extrae sus comentarios automáticamente. Se controla desde la app: <b>Seguimiento › Iniciar</b>.</p>
  <p>Mantén abierta la sesión de Facebook, Instagram o TikTok en este navegador.</p>
  <a class="btn" href="https://arlizheredia.github.io/social-comments-analyzer/#seguimiento" target="_blank" rel="noopener">Abrir la app</a>
</div>
<script src="popup.js"></script>
</body>
</html>
